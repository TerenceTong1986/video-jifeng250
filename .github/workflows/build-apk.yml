name: 🤖 Build FongMi APK (type= mod)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FongMi/TV (branch fongmi)
        uses: actions/checkout@v4
        with:
          repository: FongMi/TV
          ref: fongmi
          path: fongmi

      - name: Apply mod — CMS category param t= → type=
        run: |
          sed -i 's/params.put("t", tid);/params.put("type", tid);/' fongmi/app/src/main/java/com/fongmi/android/tv/api/SiteApi.java
          echo "=== after patch ==="
          grep -n 'params.put("type", tid)' fongmi/app/src/main/java/com/fongmi/android/tv/api/SiteApi.java

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fongmi/gradle/libs.versions.toml', 'fongmi/**/build.gradle') }}

      - name: Build APK (assembleRelease)
        working-directory: fongmi
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tail -30
          echo "=== APK files ==="
          find . -name "*.apk" -type f | head -20

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fongmi/**/*.apk
          tag_name: fongmi-mod-${{ github.run_number }}
          name: FongMi 5.6.1 mod（type=分类参数支持）
          body: |
            - 魔改: SiteApi.java 分类请求参数 t= → type=
            - 效果: 百度/暴風/索尼/闪电/虎牙/天涯/艾旦/量子/非凡 9源分类浏览全部可用
            - 构建: GitHub Actions 自动生成
          make_latest: true
          overwrite: true