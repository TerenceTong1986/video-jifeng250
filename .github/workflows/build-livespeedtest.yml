name: 🤖 Build LiveSpeedTest

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: |
          set -e
          cd LiveSpeedTest
          # Download Gradle and generate wrapper
          GRADLE_VERSION=8.7
          curl -sL -o /tmp/gradle-bin.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version=${GRADLE_VERSION}
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1
          echo "===== APK files ====="
          find . -name "*.apk" -type f

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: LiveSpeedTest/app/build/outputs/apk/release/*.apk
          tag_name: livespeedtest-${{ github.run_number }}
          name: 直播源测速工具 v${{ github.run_number }}
          body: |
            - 手机端直播源测速工具
            - 支持 txt/m3u 格式文件
            - 并发 10 线程测速，5 秒超时
            - 自动导出最优源
          make_latest: false
          overwrite: true